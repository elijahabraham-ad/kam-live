name = "kam-forms"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
# The live site origin. Set this to your preview origin while testing rather
# than loosening it to "*": a wide-open endpoint lets anyone POST mail into the
# TO_HELP inbox, and that inbox has to stay readable.
ALLOWED_ORIGIN = "https://kingdomassemblymissions.org"

# Where each kind of submission goes. Comma-separate for multiple recipients.
TO_GENERAL = "REPLACE@kingdomassemblymissions.org"
TO_PRAYER  = "REPLACE@kingdomassemblymissions.org"
TO_HELP    = "REPLACE@kingdomassemblymissions.org"

FROM_EMAIL = "KAM Website <website@kingdomassemblymissions.org>"

# RESEND_API_KEY is a SECRET, never a var:
#   npx wrangler secret put RESEND_API_KEY
